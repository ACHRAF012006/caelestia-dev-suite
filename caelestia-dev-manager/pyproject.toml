[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "caelestia-dev-manager"
version = "0.3.0"
description = "Local independent component lifecycle manager for KDE and Caelestia"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.8,<7", "packaging>=24"]

[project.scripts]
caelestia-dev-manager = "app.main:main"

[tool.setuptools.packages.find]
include = ["app*", "backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
